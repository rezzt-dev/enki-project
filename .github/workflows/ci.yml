name: CI

on:
  push:
    branches: [main, beta-version, beta-version-1.0.0]
  pull_request:
    branches: [main, beta-version, beta-version-1.0.0]

# Cancela una ejecución en curso si llega un push nuevo a la misma rama/PR, en vez de acumular runs
# redundantes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Matriz de sistemas (ALT-04): las pruebas de servicio y de ViewModel se ejecutan también en Windows y
  # macOS, donde viven la captura global de teclado (WindowsGlobalHotkey, MacGlobalHotkey), las rutas con
  # separadores propios y el sistema de archivos sin distinción de mayúsculas. fail-fast desactivado para
  # ver los tres resultados a la vez. Para impedir que una PR se fusione con alguno en rojo, los tres
  # nombres "Compilar y probar (…)" deben marcarse como comprobaciones obligatorias en la protección de
  # ramas del repositorio (ver .docs/project-info/politica-de-firma-y-ci-multiplataforma.md).
  build-and-test:
    name: Compilar y probar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enki/global.json fija la versión del SDK usada para compilar; se instala también 8.0.x de forma
      # explícita porque enki/src/enki/enki.csproj apunta a net8.0 — sin el runtime 8.0.x presente,
      # `dotnet test` falla al lanzar el test host aunque la compilación tenga éxito con un SDK más nuevo
      # (RollForward de la app no siempre lo cubre en el proceso de vstest).
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
          global-json-file: enki/global.json

      # No hay .sln en el repo (ver readme.md, "Cómo compilar y correr") — se restauran los tres
      # proyectos por separado, igual que se compilan/testean a continuación.
      - name: Restore
        run: |
          dotnet restore enki/src/enki/enki.csproj
          dotnet restore enki/tests/enki.Tests/enki.Tests.csproj
          dotnet restore enki/tests/enki.UITests/enki.UITests.csproj

      - name: Build (main app)
        run: dotnet build enki/src/enki/enki.csproj --configuration Release --no-restore

      - name: Build (unit tests)
        run: dotnet build enki/tests/enki.Tests/enki.Tests.csproj --configuration Release --no-restore

      - name: Build (UI tests)
        run: dotnet build enki/tests/enki.UITests/enki.UITests.csproj --configuration Release --no-restore

      - name: Run unit tests (enki.Tests)
        run: dotnet test enki/tests/enki.Tests/enki.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      # enki.UITests usa Avalonia.Headless — sin display real, pero sin necesitar uno tampoco (headless
      # de verdad). Ver el comentario en enki/tests/enki.UITests/enki.UITests.csproj sobre por qué vive en
      # un proyecto de test separado de enki.Tests.
      # La batería completa de pruebas de interfaz solo corre en Linux; en Windows y macOS la cubre el job
      # graph-compatibility de abajo con los casos que dependen del sistema de dibujo. Ampliarla ahí
      # requiere comprobar antes su estabilidad en esos runners.
      - name: Run UI tests (enki.UITests)
        if: runner.os == 'Linux'
        run: dotnet test enki/tests/enki.UITests/enki.UITests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

  graph-compatibility:
    name: Grafo sin navegador (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
          global-json-file: enki/global.json
      # Linux ejecuta estos mismos casos en build-and-test. No se instala ningún runtime web.
      - name: Verificar renderizado e interacción sin WebView
        run: dotnet test enki/tests/enki.UITests/enki.UITests.csproj --configuration Release --filter "FullyQualifiedName~NativeSessionGraphUiTests|FullyQualifiedName~SessionsGraphFiltersUiTests"

  lint-packaging:
    name: Lint de scripts de empaquetado
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Comprobación estática barata de enki/packaging/ (usada por .github/workflows/release.yml): un
      # error de sintaxis ahí solo se vería al cortar una release de verdad si no se detecta antes. Ni
      # `bash -n` ni `shellcheck` ejecutan el script, así que no hace falta el SDK de .NET aquí.
      - name: Comprobar sintaxis de los scripts de shell
        run: |
          for script in enki/packaging/linux/*.sh enki/packaging/macos/*.sh; do
            echo "==> bash -n $script"
            bash -n "$script"
          done

      # shellcheck viene preinstalado en los runners ubuntu-latest de GitHub Actions — se invoca
      # directamente en vez de traer una action de terceros solo para esto.
      - name: shellcheck
        run: shellcheck --severity=warning enki/packaging/linux/*.sh enki/packaging/macos/*.sh

      - name: Validar enki.desktop
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils
          desktop-file-validate enki/packaging/linux/enki.desktop

      # Ruby (con su stdlib "yaml") viene preinstalado en los runners ubuntu-latest — evita depender de
      # que PyYAML esté disponible para el python3 del sistema, que no está garantizado.
      - name: Validar YAML de release.yml
        run: ruby -ryaml -e "YAML.load_file('.github/workflows/release.yml'); puts 'release.yml OK'"
